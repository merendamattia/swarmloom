<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1500" viewBox="0 0 360 1500" role="img" aria-labelledby="mobile-lifecycle-title mobile-lifecycle-description">
  <title id="mobile-lifecycle-title">Swarmloom issue to reviewed change</title>
  <desc id="mobile-lifecycle-description">A narrow view of the Swarmloom lifecycle. An agent-ready issue becomes an implementation pull request, is reviewed, optionally loops through a fix on the same branch, and ends with a human merge and a completed issue.</desc>
  <defs>
    <marker id="lifecycle-mobile-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="lifecycle-mobile-red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="lifecycle-mobile-green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="344" height="1484" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="24" y="48" fill="#0f172a" font-size="24" font-weight="700">Issue to reviewed change</text>
    <text x="24" y="76" fill="#475569" font-size="15">Automated work loops back.</text>
    <text x="24" y="98" fill="#475569" font-size="15">The final merge stays human.</text>

    <text x="24" y="130" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.4">AUTOMATED PATH</text>

    <rect x="24" y="150" width="312" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="177" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">GITHUB ISSUE</text>
    <text x="180" y="207" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">agent:ready</text>
    <text x="180" y="230" text-anchor="middle" fill="#475569" font-size="15">Issue scanner</text>
    <path d="M180 246 V274" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#lifecycle-mobile-blue-arrow)"/>

    <rect x="24" y="276" width="312" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="303" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">DURABLE JOB</text>
    <text x="180" y="333" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">IMPLEMENTATION</text>
    <text x="180" y="356" text-anchor="middle" fill="#475569" font-size="15">Branch + worktree</text>
    <path d="M180 372 V400" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#lifecycle-mobile-blue-arrow)"/>

    <rect x="24" y="402" width="312" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="429" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">GITHUB PULL REQUEST</text>
    <text x="180" y="459" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">agent:review-requested</text>
    <text x="180" y="482" text-anchor="middle" fill="#475569" font-size="15">Targets develop</text>
    <path d="M180 498 V526" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#lifecycle-mobile-blue-arrow)"/>

    <rect x="24" y="528" width="312" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="555" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">DURABLE JOB</text>
    <text x="180" y="585" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">REVIEW</text>
    <text x="180" y="608" text-anchor="middle" fill="#475569" font-size="15">Exact PR head SHA</text>

    <text x="24" y="662" fill="#b91c1c" font-size="12" font-weight="700" letter-spacing="1.4">OPTIONAL FIX LOOP</text>
    <text x="192" y="684" fill="#7f1d1d" font-size="15">changes requested</text>

    <text x="205" y="646" fill="#166534" font-size="15">review passes</text>
    <path d="M180 624 H344 V1050 H336" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#lifecycle-mobile-green-arrow)"/>
    <path d="M180 624 V692" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#lifecycle-mobile-red-arrow)"/>
    <rect x="24" y="700" width="312" height="96" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="180" y="727" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="700">PULL REQUEST STATE</text>
    <text x="180" y="757" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">agent:fix-requested</text>
    <text x="180" y="780" text-anchor="middle" fill="#475569" font-size="15">Reviewer feedback</text>
    <path d="M180 796 V824" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#lifecycle-mobile-red-arrow)"/>

    <rect x="24" y="826" width="312" height="96" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="180" y="853" text-anchor="middle" fill="#b91c1c" font-size="13" font-weight="700">DURABLE JOB</text>
    <text x="180" y="883" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">FIX</text>
    <text x="180" y="906" text-anchor="middle" fill="#475569" font-size="15">Same PR branch</text>
    <path d="M24 874 C10 874 10 576 24 576" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#lifecycle-mobile-red-arrow)"/>
    <text x="24" y="954" fill="#b91c1c" font-size="15">FIX returns to REVIEW.</text>

    <text x="24" y="984" fill="#166534" font-size="12" font-weight="700" letter-spacing="1.4">IF REVIEW PASSES</text>

    <rect x="24" y="1002" width="312" height="96" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="180" y="1029" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">PULL REQUEST STATE</text>
    <text x="180" y="1059" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">agent:review-passed</text>
    <text x="180" y="1082" text-anchor="middle" fill="#475569" font-size="15">Ready for a human merge</text>
    <path d="M180 1098 V1126" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#lifecycle-mobile-green-arrow)"/>

    <rect x="24" y="1128" width="312" height="96" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="180" y="1155" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">ISSUE STATE</text>
    <text x="180" y="1185" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">agent:ready-to-merge</text>
    <text x="180" y="1208" text-anchor="middle" fill="#475569" font-size="15">Originating issue</text>
    <path d="M180 1224 V1252" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#lifecycle-mobile-green-arrow)"/>

    <rect x="24" y="1254" width="312" height="96" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="180" y="1281" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">HUMAN ACTION</text>
    <text x="180" y="1311" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">HUMAN MERGE</text>
    <text x="180" y="1334" text-anchor="middle" fill="#475569" font-size="15">Swarmloom does not merge</text>
    <path d="M180 1350 V1378" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#lifecycle-mobile-green-arrow)"/>

    <rect x="24" y="1380" width="312" height="96" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="180" y="1407" text-anchor="middle" fill="#166534" font-size="13" font-weight="700">GITHUB ISSUE</text>
    <text x="180" y="1437" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="700">agent:done</text>
    <text x="180" y="1460" text-anchor="middle" fill="#475569" font-size="15">Lifecycle complete</text>
  </g>
</svg>
