<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1580" role="img" aria-labelledby="title description">
  <title id="title">Swarmloom issue to merge lifecycle</title>
  <desc id="description">An agent-ready GitHub issue becomes an implementation pull request, an independent review, an optional fix loop, and finally a human-merged issue. The passing-review labels are shown separately for the pull request and the issue.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
  </defs>

  <rect width="760" height="1580" rx="28" fill="#0f172a"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="40" y="58" fill="#f8fafc" font-size="30" font-weight="700">From issue to reviewed change</text>
    <text x="40" y="91" fill="#cbd5e1" font-size="19">GitHub state drives durable jobs.</text>
    <text x="40" y="119" fill="#cbd5e1" font-size="19">The final merge stays with a human.</text>

    <rect x="40" y="145" width="680" height="105" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="380" y="178" text-anchor="middle" fill="#bfdbfe" font-size="18" font-weight="700">GITHUB ISSUE</text>
    <text x="380" y="213" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">agent:ready</text>
    <text x="380" y="236" text-anchor="middle" fill="#cbd5e1" font-size="19">Issue scanner</text>

    <line x1="380" y1="250" x2="380" y2="260" stroke="#93c5fd" stroke-width="4" marker-end="url(#blue-arrow)"/>

    <rect x="40" y="275" width="680" height="105" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="380" y="308" text-anchor="middle" fill="#bfdbfe" font-size="18" font-weight="700">DURABLE JOB</text>
    <text x="380" y="343" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">IMPLEMENTATION</text>
    <text x="380" y="366" text-anchor="middle" fill="#cbd5e1" font-size="19">Branch + worktree</text>

    <line x1="380" y1="380" x2="380" y2="390" stroke="#93c5fd" stroke-width="4" marker-end="url(#blue-arrow)"/>

    <rect x="40" y="405" width="680" height="105" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="380" y="438" text-anchor="middle" fill="#bfdbfe" font-size="18" font-weight="700">GITHUB PULL REQUEST</text>
    <text x="380" y="473" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">agent:review-requested</text>
    <text x="380" y="496" text-anchor="middle" fill="#cbd5e1" font-size="19">Targets develop</text>

    <line x1="380" y1="510" x2="380" y2="520" stroke="#93c5fd" stroke-width="4" marker-end="url(#blue-arrow)"/>

    <rect x="40" y="535" width="680" height="105" rx="16" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <text x="380" y="568" text-anchor="middle" fill="#bfdbfe" font-size="18" font-weight="700">DURABLE JOB</text>
    <text x="380" y="603" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">REVIEW</text>
    <text x="380" y="626" text-anchor="middle" fill="#cbd5e1" font-size="19">Exact PR head SHA</text>

    <text x="54" y="682" fill="#fca5a5" font-size="17" font-weight="700" letter-spacing="1.5">OPTIONAL FIX LOOP</text>

    <line x1="380" y1="640" x2="380" y2="690" stroke="#fb7185" stroke-width="4" marker-end="url(#red-arrow)"/>
    <text x="404" y="672" fill="#fda4af" font-size="17">if changes are requested</text>

    <rect x="40" y="705" width="680" height="105" rx="16" fill="#3f1d2e" stroke="#fb7185" stroke-width="3"/>
    <text x="380" y="738" text-anchor="middle" fill="#fecdd3" font-size="18" font-weight="700">PULL REQUEST STATE</text>
    <text x="380" y="773" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">agent:fix-requested</text>
    <text x="380" y="796" text-anchor="middle" fill="#cbd5e1" font-size="19">Reviewer feedback</text>

    <line x1="380" y1="810" x2="380" y2="820" stroke="#fb7185" stroke-width="4" marker-end="url(#red-arrow)"/>

    <rect x="40" y="835" width="680" height="105" rx="16" fill="#3f1d2e" stroke="#fb7185" stroke-width="3"/>
    <text x="380" y="868" text-anchor="middle" fill="#fecdd3" font-size="18" font-weight="700">DURABLE JOB</text>
    <text x="380" y="903" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">FIX</text>
    <text x="380" y="926" text-anchor="middle" fill="#cbd5e1" font-size="19">Same PR branch</text>

    <path d="M 40 888 C 15 888, 15 588, 40 588" fill="none" stroke="#fb7185" stroke-width="4" marker-end="url(#red-arrow)"/>
    <text x="54" y="974" fill="#fda4af" font-size="17">returns to REVIEW</text>

    <path d="M 720 588 C 745 588, 745 1052, 720 1052" fill="none" stroke="#86efac" stroke-width="4" marker-end="url(#green-arrow)"/>
    <text x="532" y="672" fill="#bbf7d0" font-size="17">if review passes</text>

    <text x="54" y="1014" fill="#86efac" font-size="17" font-weight="700" letter-spacing="1.5">REVIEW PASSED</text>

    <rect x="40" y="1030" width="680" height="105" rx="16" fill="#14352a" stroke="#4ade80" stroke-width="3"/>
    <text x="380" y="1063" text-anchor="middle" fill="#bbf7d0" font-size="18" font-weight="700">PULL REQUEST STATE</text>
    <text x="380" y="1098" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">agent:review-passed</text>
    <text x="380" y="1121" text-anchor="middle" fill="#cbd5e1" font-size="19">Human merge still required</text>

    <line x1="380" y1="1135" x2="380" y2="1145" stroke="#86efac" stroke-width="4" marker-end="url(#green-arrow)"/>

    <rect x="40" y="1170" width="680" height="105" rx="16" fill="#14352a" stroke="#4ade80" stroke-width="3"/>
    <text x="380" y="1203" text-anchor="middle" fill="#bbf7d0" font-size="18" font-weight="700">ISSUE STATE</text>
    <text x="380" y="1238" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">agent:ready-to-merge</text>
    <text x="380" y="1261" text-anchor="middle" fill="#cbd5e1" font-size="19">Originating issue</text>

    <line x1="380" y1="1275" x2="380" y2="1285" stroke="#86efac" stroke-width="4" marker-end="url(#green-arrow)"/>

    <rect x="40" y="1310" width="680" height="105" rx="16" fill="#14352a" stroke="#4ade80" stroke-width="3"/>
    <text x="380" y="1343" text-anchor="middle" fill="#bbf7d0" font-size="18" font-weight="700">HUMAN ACTION</text>
    <text x="380" y="1378" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">HUMAN MERGE</text>
    <text x="380" y="1401" text-anchor="middle" fill="#cbd5e1" font-size="19">Swarmloom does not merge</text>

    <line x1="380" y1="1415" x2="380" y2="1425" stroke="#86efac" stroke-width="4" marker-end="url(#green-arrow)"/>

    <rect x="40" y="1450" width="680" height="105" rx="16" fill="#14352a" stroke="#4ade80" stroke-width="3"/>
    <text x="380" y="1483" text-anchor="middle" fill="#bbf7d0" font-size="18" font-weight="700">GITHUB ISSUE</text>
    <text x="380" y="1518" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700">agent:done</text>
    <text x="380" y="1541" text-anchor="middle" fill="#cbd5e1" font-size="19">Lifecycle complete</text>
  </g>
</svg>
