<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title description">
  <title id="title">Swarmloom issue to merge lifecycle</title>
  <desc id="description">An agent-ready GitHub issue becomes an implementation pull request, an independent review, an optional fix loop, and finally a human-merged issue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
  </defs>

  <rect width="1200" height="540" rx="24" fill="#0f172a"/>
  <text x="54" y="58" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">From issue to reviewed change</text>
  <text x="54" y="87" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">GitHub state drives durable jobs; the final merge stays with a human.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="50" y="135" width="190" height="112" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="145" y="170" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">GITHUB ISSUE</text>
    <text x="145" y="199" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">agent:ready</text>
    <text x="145" y="225" text-anchor="middle" fill="#cbd5e1" font-size="13">Issue scanner</text>

    <rect x="290" y="135" width="190" height="112" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="385" y="170" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">DURABLE JOB</text>
    <text x="385" y="199" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">IMPLEMENTATION</text>
    <text x="385" y="225" text-anchor="middle" fill="#cbd5e1" font-size="13">Branch + worktree</text>

    <rect x="530" y="135" width="190" height="112" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="625" y="170" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">GITHUB PULL REQUEST</text>
    <text x="625" y="199" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">review-requested</text>
    <text x="625" y="225" text-anchor="middle" fill="#cbd5e1" font-size="13">Targets develop</text>

    <rect x="770" y="135" width="190" height="112" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="865" y="170" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">DURABLE JOB</text>
    <text x="865" y="199" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">REVIEW</text>
    <text x="865" y="225" text-anchor="middle" fill="#cbd5e1" font-size="13">Exact PR head SHA</text>

    <line x1="240" y1="191" x2="286" y2="191" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="480" y1="191" x2="526" y2="191" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="720" y1="191" x2="766" y2="191" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="54" y="292" fill="#fca5a5" font-size="13" font-weight="700" letter-spacing="1">CHANGES REQUESTED</text>
    <rect x="50" y="312" width="190" height="100" rx="14" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
    <text x="145" y="348" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="700">PR STATE</text>
    <text x="145" y="377" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">agent:fix-requested</text>
    <text x="145" y="399" text-anchor="middle" fill="#cbd5e1" font-size="13">Reviewer feedback</text>

    <rect x="290" y="312" width="190" height="100" rx="14" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
    <text x="385" y="348" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="700">DURABLE JOB</text>
    <text x="385" y="377" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">FIX</text>
    <text x="385" y="399" text-anchor="middle" fill="#cbd5e1" font-size="13">Same PR branch</text>

    <path d="M 835 249 C 835 284, 145 270, 145 308" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="240" y1="362" x2="286" y2="362" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 480 362 C 555 438, 790 438, 865 249" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="550" y="292" fill="#86efac" font-size="13" font-weight="700" letter-spacing="1">REVIEW PASSED</text>
    <rect x="520" y="312" width="190" height="100" rx="14" fill="#14352a" stroke="#4ade80" stroke-width="2"/>
    <text x="615" y="348" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">PR + ISSUE STATE</text>
    <text x="615" y="377" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">ready-to-merge</text>
    <text x="615" y="399" text-anchor="middle" fill="#cbd5e1" font-size="13">Human decision next</text>

    <rect x="750" y="312" width="190" height="100" rx="14" fill="#14352a" stroke="#4ade80" stroke-width="2"/>
    <text x="845" y="348" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">GITHUB ACTION</text>
    <text x="845" y="377" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">HUMAN MERGE</text>
    <text x="845" y="399" text-anchor="middle" fill="#cbd5e1" font-size="13">Swarmloom does not merge</text>

    <rect x="980" y="312" width="170" height="100" rx="14" fill="#14352a" stroke="#4ade80" stroke-width="2"/>
    <text x="1065" y="348" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">GITHUB ISSUE</text>
    <text x="1065" y="377" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">agent:done</text>
    <text x="1065" y="399" text-anchor="middle" fill="#cbd5e1" font-size="13">Lifecycle complete</text>

    <path d="M 865 249 L 615 308" fill="none" stroke="#86efac" stroke-width="3" marker-end="url(#green-arrow)"/>
    <line x1="710" y1="362" x2="746" y2="362" stroke="#86efac" stroke-width="3" marker-end="url(#green-arrow)"/>
    <line x1="940" y1="362" x2="976" y2="362" stroke="#86efac" stroke-width="3" marker-end="url(#green-arrow)"/>
  </g>
</svg>
