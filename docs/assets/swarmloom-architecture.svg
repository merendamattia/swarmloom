<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Swarmloom runtime architecture</title>
  <desc id="description">GitHub connects to the Swarmloom API and scheduler, which records state in PostgreSQL and delivers jobs through BullMQ and Redis to workers. Workers use provider adapters and isolated repository worktrees; the dashboard and Telegram receive operational state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86efac"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#0f172a"/>
  <text x="48" y="54" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">One workflow, clear ownership</text>
  <text x="48" y="83" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">GitHub is the visible protocol; PostgreSQL and BullMQ keep the system durable.</text>

  <rect x="36" y="104" width="1128" height="510" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="58" y="134" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EXTERNAL SYSTEMS</text>
  <text x="300" y="134" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SWARMLOOM RUNTIME</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="58" y="176" width="190" height="176" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="153" y="211" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">GITHUB</text>
    <rect x="82" y="232" width="142" height="40" rx="9" fill="#1e3a8a"/>
    <text x="153" y="257" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Issues</text>
    <rect x="82" y="286" width="142" height="40" rx="9" fill="#1e3a8a"/>
    <text x="153" y="311" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Pull Requests</text>

    <rect x="300" y="158" width="260" height="100" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="430" y="193" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">API + SCHEDULER</text>
    <text x="430" y="220" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Hono + scanners</text>
    <text x="430" y="241" text-anchor="middle" fill="#cbd5e1" font-size="13">Discover and reconcile state</text>

    <rect x="300" y="304" width="260" height="100" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="430" y="339" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">DELIVERY</text>
    <text x="430" y="366" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">BullMQ + Redis</text>
    <text x="430" y="387" text-anchor="middle" fill="#cbd5e1" font-size="13">Jobs, retries, locks</text>

    <rect x="300" y="450" width="260" height="100" rx="14" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <text x="430" y="485" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">OPERATOR VIEW</text>
    <text x="430" y="512" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Next.js dashboard</text>
    <text x="430" y="533" text-anchor="middle" fill="#cbd5e1" font-size="13">Health, jobs, evidence</text>

    <rect x="640" y="158" width="250" height="100" rx="14" fill="#14352a" stroke="#4ade80" stroke-width="2"/>
    <text x="765" y="193" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">EXECUTION</text>
    <text x="765" y="220" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Workers</text>
    <text x="765" y="241" text-anchor="middle" fill="#cbd5e1" font-size="13">Claim, guard, execute</text>

    <rect x="940" y="158" width="190" height="100" rx="14" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
    <text x="1035" y="193" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="700">PROVIDER ADAPTERS</text>
    <text x="1035" y="220" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">Codex / OpenCode</text>
    <text x="1035" y="241" text-anchor="middle" fill="#cbd5e1" font-size="13">One common contract</text>

    <rect x="640" y="304" width="250" height="100" rx="14" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="765" y="339" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="700">DURABLE STATE</text>
    <text x="765" y="366" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">PostgreSQL</text>
    <text x="765" y="387" text-anchor="middle" fill="#cbd5e1" font-size="13">Jobs, history, events, settings</text>

    <rect x="640" y="450" width="250" height="100" rx="14" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <text x="765" y="485" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="700">WORKER STORAGE</text>
    <text x="765" y="512" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Clones + worktrees</text>
    <text x="765" y="533" text-anchor="middle" fill="#cbd5e1" font-size="13">Isolated repository state</text>

    <rect x="940" y="304" width="190" height="100" rx="14" fill="#3f1d2e" stroke="#fb7185" stroke-width="2"/>
    <text x="1035" y="339" text-anchor="middle" fill="#fecdd3" font-size="13" font-weight="700">OPTIONAL OUTPUT</text>
    <text x="1035" y="366" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Telegram</text>
    <text x="1035" y="387" text-anchor="middle" fill="#cbd5e1" font-size="13">Selected notifications</text>

    <line x1="248" y1="238" x2="296" y2="208" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="560" y1="208" x2="634" y2="208" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="430" y1="258" x2="430" y2="296" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="560" y1="354" x2="634" y2="208" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="890" y1="208" x2="934" y2="208" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="765" y1="258" x2="765" y2="298" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="765" y1="404" x2="765" y2="444" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="560" y1="500" x2="470" y2="500" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="890" y1="354" x2="934" y2="354" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 640 354 C 590 354, 560 354, 560 354" fill="none" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>

    <text x="256" y="195" fill="#93c5fd" font-size="12">read / write</text>
    <text x="568" y="194" fill="#93c5fd" font-size="12">reconcile</text>
    <text x="573" y="337" fill="#93c5fd" font-size="12">enqueue</text>
    <text x="897" y="194" fill="#fb7185" font-size="12">run session</text>
    <text x="792" y="292" fill="#a5b4fc" font-size="12">persist</text>
    <text x="898" y="340" fill="#fb7185" font-size="12">notify</text>
  </g>
</svg>
