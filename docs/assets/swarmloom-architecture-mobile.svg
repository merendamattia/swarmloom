<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1310" viewBox="0 0 360 1310" role="img" aria-labelledby="mobile-architecture-title mobile-architecture-description">
  <title id="mobile-architecture-title">Swarmloom runtime architecture</title>
  <desc id="mobile-architecture-description">A narrow view of the Swarmloom runtime. GitHub state flows through the API and scheduler, BullMQ and Redis deliver jobs to workers, and workers use providers, PostgreSQL, isolated worktrees, the dashboard, and optional Telegram notifications.</desc>
  <defs>
    <marker id="architecture-mobile-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="architecture-mobile-gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="344" height="1294" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="24" y="48" fill="#0f172a" font-size="25" font-weight="700">Where work moves</text>
    <text x="24" y="76" fill="#475569" font-size="15">The API produces jobs.</text>
    <text x="24" y="98" fill="#475569" font-size="15">Workers execute them.</text>
    <text x="24" y="120" fill="#475569" font-size="15">PostgreSQL keeps the record.</text>

    <text x="24" y="152" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.4">REQUEST PATH</text>

    <rect x="24" y="172" width="312" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="199" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">EXTERNAL STATE</text>
    <text x="180" y="226" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">GITHUB</text>
    <text x="180" y="247" text-anchor="middle" fill="#475569" font-size="15">Issues + Pull Requests</text>
    <path d="M180 258 V282" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#architecture-mobile-blue-arrow)"/>

    <rect x="24" y="284" width="312" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="311" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">CONTROL PLANE</text>
    <text x="180" y="338" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">API + SCHEDULER</text>
    <text x="180" y="359" text-anchor="middle" fill="#475569" font-size="15">Reconcile GitHub state</text>
    <path d="M180 370 V394" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#architecture-mobile-blue-arrow)"/>

    <rect x="24" y="396" width="312" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="423" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">DELIVERY</text>
    <text x="180" y="450" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">BULLMQ + REDIS</text>
    <text x="180" y="471" text-anchor="middle" fill="#475569" font-size="15">Deliver and lock jobs</text>
    <path d="M180 482 V506" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#architecture-mobile-blue-arrow)"/>

    <rect x="24" y="508" width="312" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="535" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">EXECUTION</text>
    <text x="180" y="562" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">WORKERS</text>
    <text x="180" y="583" text-anchor="middle" fill="#475569" font-size="15">Only durable-job executor</text>
    <path d="M180 594 V618" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#architecture-mobile-blue-arrow)"/>

    <rect x="24" y="620" width="312" height="86" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="647" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="700">PROVIDER ADAPTERS</text>
    <text x="180" y="674" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">CODEX / OPENCODE</text>
    <text x="180" y="695" text-anchor="middle" fill="#475569" font-size="15">Run the selected session</text>

    <text x="24" y="750" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.4">DURABLE STATE</text>

    <path d="M24 551 C10 551 10 818 24 818" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#architecture-mobile-gray-arrow)"/>
    <path d="M336 551 C350 551 350 940 336 940" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#architecture-mobile-gray-arrow)"/>

    <rect x="24" y="770" width="312" height="86" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="180" y="797" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">BUSINESS STATE + HISTORY</text>
    <text x="180" y="824" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">POSTGRESQL</text>
    <text x="180" y="845" text-anchor="middle" fill="#475569" font-size="15">Claims, events, settings</text>

    <rect x="24" y="892" width="312" height="86" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="180" y="919" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">WORKER STORAGE</text>
    <text x="180" y="946" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">WORKTREES</text>
    <text x="180" y="967" text-anchor="middle" fill="#475569" font-size="15">Isolated repositories</text>

    <text x="180" y="1014" text-anchor="middle" fill="#475569" font-size="15">Workers record state and isolate each change.</text>

    <text x="24" y="1056" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.4">OPERATING SURFACES</text>

    <rect x="24" y="1076" width="312" height="86" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="180" y="1103" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">OBSERVABILITY</text>
    <text x="180" y="1130" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">DASHBOARD</text>
    <text x="180" y="1151" text-anchor="middle" fill="#475569" font-size="15">Reads the API</text>

    <rect x="24" y="1198" width="312" height="86" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="180" y="1225" text-anchor="middle" fill="#334155" font-size="13" font-weight="700">NOTIFICATIONS</text>
    <text x="180" y="1252" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">TELEGRAM</text>
    <text x="180" y="1273" text-anchor="middle" fill="#475569" font-size="15">Optional worker events</text>
  </g>
</svg>
