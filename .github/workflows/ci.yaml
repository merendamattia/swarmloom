name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: swarmloom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d swarmloom"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      NODE_ENV: test
      RUN_INTEGRATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swarmloom
      REDIS_URL: redis://localhost:6379
      SETTINGS_ENCRYPTION_KEY: test-settings-encryption-key-0123456789
      GITHUB_TOKEN: test-token
      GITHUB_REPOSITORIES: acme/app,acme/main-only
      AGENT_PROVIDER: codex
      FRONTEND_URL: http://localhost:18420
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.14}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: bun install --frozen-lockfile
      - run: pip install -r requirements.txt
      - run: pre-commit run --all-files
      - run: bun run db:generate
      - run: bun run db:deploy
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
