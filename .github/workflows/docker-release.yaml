name: Push Docker image to Docker Hub

on:
  workflow_run:
    workflows: [Semantic Release]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Determine tag to use
        id: determine_tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            git fetch --tags --quiet
            TAG=$(git for-each-ref --sort=-version:refname --format '%(refname:short)' refs/tags | head -n1 || true)
          fi
          TAG="${TAG:-${HEAD_BRANCH:-latest}}"
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ steps.determine_tag.outputs.tag }}
            ${{ env.DOCKERHUB_REPO }}:latest
