name: Check Docker image building
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://swarmloom:test@postgres:5432/swarmloom
      POSTGRES_PASSWORD: test
      REDIS_URL: redis://redis:6379
      SETTINGS_ENCRYPTION_KEY: test-settings-encryption-key-0123456789
      GITHUB_TOKEN: test-token
      GITHUB_REPOSITORIES: owner/repository
      PUBLIC_API_URL: https://worker.example.com
      FRONTEND_URL: https://worker.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Resolve production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml config --quiet
      - name: Build production application image
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml build backend
      - name: Verify production agent runtime
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps backend sh -c 'test -f /app/agent-runtime/instructions/global-skills.md && test -f /app/agent-runtime/instructions/global.md'
      - name: Verify ephemeral CI services
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps backend sh -c 'eval "$(swarm-test-services start swarmloom)" && psql "$DATABASE_URL" -c "SELECT 1" >/dev/null && redis-cli ping | grep -q PONG && swarm-test-services stop'
