name: Check Docker image building
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://swarmloom:test@postgres:5432/swarmloom
      POSTGRES_PASSWORD: test
      REDIS_URL: redis://redis:6379
      SETTINGS_ENCRYPTION_KEY: test-settings-encryption-key-0123456789
      GITHUB_TOKEN: test-token
      GITHUB_REPOSITORIES: owner/repository
      PUBLIC_API_URL: https://worker.example.com
      FRONTEND_URL: https://worker.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Resolve local Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Resolve production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production application image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: swarmloom:production
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
          cache-from: type=gha,scope=swarmloom-production
          # PR caches are scoped to that merge ref; only develop pushes write a reusable branch cache.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=swarmloom-production,mode=max' || '' }}
      # skills@latest uses the universal path for Codex and OpenCode, and the Claude path separately.
      - name: Verify production agent runtime
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps backend sh -c 'set -eu; test -f /app/agent-runtime/instructions/global-skills.md; test -f /app/agent-runtime/instructions/global.md; for skill in /home/bun/.agents/skills/archify/SKILL.md /home/bun/.claude/skills/archify/SKILL.md; do test -f "$skill"; done'
      - name: Verify skills Node runtime
        run: >-
          docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps backend
          sh -c 'set -eu; node --input-type=module -e "import { glob } from \"node:fs/promises\"; if (typeof glob !== \"function\") throw new Error(\"Node glob unavailable\");"; npm --version; npx --version'
      - name: Verify worker CI toolchain
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps backend sh -c 'set -eu; test "$(bun --version)" = "1.4.4"; for command in bun python3 pip pre-commit gcc g++ make pkg-config git gh psql redis-cli; do command -v "$command" >/dev/null; done; gh issue comment --help | grep -q -- "--attach"; codex exec --help | grep -q -- "--dangerously-bypass-approvals-and-sandbox"; test -z "$(find /app/node_modules -type f -path "*/msgpackr-extract/build/Release/*.node" -print -quit)"; cd /app/src/backend; bun -e "import(\"bullmq\")"'
      - name: Verify ephemeral CI services
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps backend sh -c 'eval "$(swarm-test-services start swarmloom)" && psql "$DATABASE_URL" -c "SELECT 1" >/dev/null && redis-cli ping | grep -q PONG && swarm-test-services stop'
      - name: Verify headless browsers and screenshot attachments
        run: docker compose --env-file .env.production.example -f docker-compose.production.yaml run --rm --no-deps worker sh -c 'set -eu; gh issue comment --help | grep -q -- "--attach"; python3 /app/scripts/check-worker-browsers.py'
