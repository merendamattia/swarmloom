name: swarmloom

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-swarmloom}:${POSTGRES_PASSWORD:-swarmloom}@postgres:5432/${POSTGRES_DB:-swarmloom}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY is required}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-local-development-token}
  GH_TOKEN: ${GITHUB_TOKEN:-local-development-token}
  GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-owner/repository}
  GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
  GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-swarmloom}
  GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-swarmloom@users.noreply.github.com}
  ISSUE_READY_LABEL: ${ISSUE_READY_LABEL:-agent:ready}
  ISSUE_WORKING_LABEL: ${ISSUE_WORKING_LABEL:-agent:working}
  ISSUE_BLOCKED_LABEL: ${ISSUE_BLOCKED_LABEL:-agent:blocked}
  ISSUE_COMPLETED_LABEL: ${ISSUE_COMPLETED_LABEL:-agent:done}
  ISSUE_DECOMPOSED_LABEL: ${ISSUE_DECOMPOSED_LABEL:-agent:decomposed}
  ISSUE_READY_TO_MERGE_LABEL: ${ISSUE_READY_TO_MERGE_LABEL:-agent:ready-to-merge}
  ISSUE_HUMAN_REVIEW_LABEL: ${ISSUE_HUMAN_REVIEW_LABEL:-agent:human-review}
  PR_REVIEW_REQUESTED_LABEL: ${PR_REVIEW_REQUESTED_LABEL:-agent:review-requested}
  PR_FIX_REQUESTED_LABEL: ${PR_FIX_REQUESTED_LABEL:-agent:fix-requested}
  PR_REVIEW_PASSED_LABEL: ${PR_REVIEW_PASSED_LABEL:-agent:review-passed}
  MAX_AUTOMATIC_FIX_CYCLES: ${MAX_AUTOMATIC_FIX_CYCLES:-5}
  CREATE_DIAGNOSTIC_ISSUES: ${CREATE_DIAGNOSTIC_ISSUES:-false}
  SCHEDULE_CRON: ${SCHEDULE_CRON:-*/30 * * * *}
  SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-UTC}
  MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-1}
  DATA_DIR: /data
  AGENT_RUNTIME_DIR: /app/agent-runtime
  BUN_INSTALL_CACHE_DIR: /data/bun-cache
  BUN_INSTALL_IGNORE_SCRIPTS: "1"
  PIP_CACHE_DIR: /data/pip-cache
  PRE_COMMIT_HOME: /data/pre-commit-cache
  AGENT_PROVIDER: ${AGENT_PROVIDER:-codex}
  OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode-go/deepseek-v4-flash}
  CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-luna}
  CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-max}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:18420}
  WORKER_ID: ${WORKER_ID:-local-worker-1}
  HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-10000}
  STALE_JOB_THRESHOLD_MS: ${STALE_JOB_THRESHOLD_MS:-60000}
  AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-7200000}
  CODEX_HOME: /data/codex-home
  XDG_DATA_HOME: /data/opencode-data
  XDG_CONFIG_HOME: /data/opencode-config
  OPENCODE_CONFIG_DIR: /data/opencode-config
  OPENCODE_PERMISSION: '{"*":"allow"}'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swarmloom}
      POSTGRES_USER: ${POSTGRES_USER:-swarmloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swarmloom}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:${POSTGRES_PORT:-17432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarmloom} -d ${POSTGRES_DB:-swarmloom}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    ports: ["127.0.0.1:${REDIS_PORT:-18422}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: {context: ., dockerfile: Dockerfile, target: dev}
    image: swarmloom:local
    environment:
      <<: *app-environment
      PORT: 18421
    command: ["sh", "-c", "bun run db:deploy && bun run dev:backend"]
    ports: ["127.0.0.1:${BACKEND_PORT:-18421}:18421"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:18421/api/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./src/backend:/app/src/backend
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      - worker_data:/data
      - codex_home:/data/codex-home
      - opencode_data:/data/opencode-data
      - opencode_config:/data/opencode-config
      - ${AGENT_RUNTIME_HOST_PATH:-./agent-runtime}:/app/agent-runtime:ro

  worker:
    image: swarmloom:local
    environment: *app-environment
    command: ["bun", "run", "dev:worker"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./src/backend:/app/src/backend
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      - worker_data:/data
      - codex_home:/data/codex-home
      - opencode_data:/data/opencode-data
      - opencode_config:/data/opencode-config
      - ${AGENT_RUNTIME_HOST_PATH:-./agent-runtime}:/app/agent-runtime:ro

  frontend:
    image: swarmloom:local
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:18421}
      PORT: 18420
    command: ["bun", "run", "dev:frontend"]
    ports: ["127.0.0.1:${FRONTEND_PORT:-18420}:18420"]
    depends_on: {backend: {condition: service_healthy}}
    volumes: ["./src/frontend:/app/src/frontend"]

volumes:
  postgres_data:
  redis_data:
  worker_data:
  codex_home:
  opencode_data:
  opencode_config:
